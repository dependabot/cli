name: Dependabot job
description: Run an API-backed Dependabot job using the CLI's container runner
author: Dependabot
inputs:
  api-url:
    description: Dependabot API base URL, including any path prefix; required unless supplied by a Dependabot dynamic event
    required: false
  api-docker-url:
    description: API base URL for updater and proxy containers; defaults to the dynamic event's Docker URL or api-url
    required: false
  job-id:
    description: Dependabot update job ID; required unless supplied by a Dependabot dynamic event
    required: false
  job-token:
    description: Job token (alternatively set GITHUB_DEPENDABOT_JOB_TOKEN or use the Dependabot dynamic event)
    required: false
  credentials-token:
    description: Credentials token (alternatively set GITHUB_DEPENDABOT_CRED_TOKEN or use the Dependabot dynamic event)
    required: false
  updater-image:
    description: Updater image override; otherwise taken from the dynamic event or selected from the job's package manager
    required: false
  proxy-image:
    description: Proxy image override
    required: false
  pull-images:
    description: Pull images before running; false uses images already on the runner
    default: 'true'
  skip-image-verification:
    description: Skip updater, proxy, and configured OpenTelemetry collector image verification for trusted development images; enabled by default on this test branch
    default: 'true'
  timeout:
    description: Maximum execution duration, excluding API bootstrap (Go duration)
    default: 60m
  volumes:
    description: Bind mounts, one absolute Action-container source:destination[:ro] per line
    required: false
  updater-env:
    description: Additional updater environment variables, one NAME=value per line
    required: false
runs:
  using: docker
  image: Dockerfile
